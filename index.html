<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 수학</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1714">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f0ea;--fg:#1a1714;--card:#ebe5dc;--card-h:#e2dbd1;--muted:#78726a;--body:#4a443c;
  --accent:#c8b9a6;--border:#d8d0c4;--red:#b44133;--green:#5a7a5a;--blue:#4a6b8a;
  --radius:0.5rem;--sans:'Noto Sans KR',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;font-size:20px;}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;}
body{font-family:var(--sans);background:var(--bg);color:var(--fg);line-height:1.8;font-size:1.06rem;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}


header{position:sticky;top:0;z-index:100;background:rgba(245,240,234,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
/* 드롭다운 패널이 잘리지 않도록 overflow 를 두지 않습니다(가로 버튼 나열을 없앤 뒤로 불필요). */
nav{max-width:68rem;margin:0 auto;display:flex;align-items:center;gap:1.1rem;padding:0.75rem 1.5rem;overflow:visible;}
.logo{font-size:0.95rem;font-weight:600;letter-spacing:-0.02em;color:var(--fg);text-decoration:none;white-space:nowrap;flex-shrink:0;}
.nav-btn{font-family:var(--mono);font-size:0.8rem;letter-spacing:0.06em;padding:0.55rem 0.9rem;border:1px solid var(--border);border-radius:9999px;background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;white-space:nowrap;flex-shrink:0;}
.nav-btn:hover{border-color:var(--muted);color:var(--fg);}
.nav-btn.active{background:var(--fg);color:var(--bg);border-color:var(--fg);}


main{max-width:68rem;margin:0 auto;padding:0 1.5rem;flex:1;width:100%;}
.view{display:none;padding:3rem 0 4rem;animation:fadeIn 0.3s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}


.mono{font-family:var(--mono);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.18em;color:var(--muted);}
h1{font-size:clamp(1.6rem,3.8vw,2.5rem);font-weight:600;letter-spacing:-0.03em;line-height:1.25;white-space:nowrap;}
h2{font-size:clamp(1.35rem,2.6vw,1.8rem);font-weight:600;letter-spacing:-0.02em;margin-bottom:0.6rem;}
h3{font-size:1.15rem;font-weight:600;margin-bottom:0.6rem;}
.desc{font-size:1.05rem;color:var(--body);max-width:42rem;margin-bottom:2rem;line-height:1.85;}


.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem;margin-bottom:1.2rem;box-shadow:0 1px 2px rgba(26,23,20,0.04);}
.card p,.card li{font-size:1.0rem;color:var(--body);line-height:1.85;}
.card-link{background:var(--card);border-radius:var(--radius);padding:1.4rem;cursor:pointer;transition:all 0.2s;border:1px solid var(--border);position:relative;box-shadow:0 1px 2px rgba(26,23,20,0.04);}
.card-link:hover{background:var(--card-h);border-color:var(--muted);transform:translateY(-2px);box-shadow:0 2px 8px rgba(26,23,20,0.06);}
.card-link::after{content:'→';position:absolute;top:1.4rem;right:1.4rem;font-size:0.9rem;color:var(--muted);transition:transform 0.2s;}
.card-link:hover::after{transform:translateX(3px);color:var(--fg);}
.card-link h3{font-size:1.15rem;font-weight:600;margin-bottom:0.5rem;}
.card-link p{font-size:1.02rem;color:var(--body);line-height:1.85;padding-right:1.5rem;}


.math{background:var(--fg);color:var(--bg);border-left:3px solid var(--accent);border-radius:var(--radius);padding:1.2rem 1.5rem;font-family:var(--mono);font-size:0.95rem;line-height:1.9;overflow-x:auto;margin:1.2rem 0;white-space:pre-line;}
.mi{font-family:var(--mono);font-size:0.78em;background:var(--card);padding:0.1rem 0.3rem;border-radius:3px;}


.btn{font-family:var(--mono);font-size:0.78rem;letter-spacing:0.07em;text-transform:uppercase;padding:0.5rem 1rem;min-height:2rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--fg);cursor:pointer;transition:all 0.2s;user-select:none;}
.btn:hover{background:var(--card-h);}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg);}
.btn.pri:hover{opacity:0.85;}
.btn:disabled{opacity:0.35;cursor:not-allowed;}
.btn-row{display:flex;gap:0.4rem;flex-wrap:wrap;margin:0.8rem 0;}


.info{background:var(--card);border-left:3px solid var(--accent);padding:0.9rem 1.1rem;border-radius:0 var(--radius) var(--radius) 0;margin:1.4rem 0;font-size:1.0rem;color:var(--muted);line-height:1.9;}
.cnn-step .card{border-left:4px solid var(--accent);}
.cnn-tl-btn{flex:1;min-width:0;padding:0.45rem 0.3rem;font-size:0.62rem;font-family:var(--mono);border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--muted);cursor:pointer;text-align:center;line-height:1.3;transition:all 0.2s;}
.info strong{color:var(--fg);}
.status{font-family:var(--mono);font-size:0.72rem;color:var(--muted);margin:0.6rem 0;min-height:1.3rem;}


.tags{display:flex;flex-wrap:wrap;gap:0.35rem;margin-top:1rem;}
.tag{font-family:var(--mono);font-size:0.6rem;padding:0.22rem 0.55rem;background:var(--card);border-radius:9999px;color:var(--muted);}


.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.4rem;}
.tab{font-family:var(--mono);font-size:0.78rem;letter-spacing:0.05em;padding:0.5rem 1rem;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all 0.2s;}
.tab:hover{color:var(--fg);}
.tab.on{color:var(--fg);border-bottom-color:var(--fg);}
.tpanel{display:none;}.tpanel.on{display:block;}


.mn-ds{display:grid;grid-template-columns:1.2fr 0.9fr;gap:1.2rem;align-items:start;margin-top:0.9rem;}
@media (max-width:820px){.mn-ds{grid-template-columns:1fr;}}
.mn-cvbox{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden;}
#mn-cv{display:block;width:100%;max-width:520px;aspect-ratio:1/1;background:#fff;border-bottom:1px solid var(--border);touch-action:none;}
.mn-tools{padding:0.75rem 0.85rem;}
.mn-row{display:flex;align-items:center;gap:0.6rem;}
.mn-labs{display:flex;flex-wrap:wrap;gap:0.35rem;}
.mn-labs button{width:2.2rem;height:2.2rem;border-radius:0.7rem;border:1px solid var(--border);background:var(--bg);font-family:var(--mono);font-weight:700;cursor:pointer;}
.mn-labs button.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.mn-prev{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:0.9rem;text-align:center;}
#mn-prev{width:100%;max-width:200px;aspect-ratio:1/1;background:#fff;border-radius:0.75rem;border:1px solid var(--border);}
.mn-samples{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:0.7rem;}
.mn-smp{border:1px solid var(--border);border-radius:0.9rem;background:var(--bg);padding:0.65rem;}
.mn-smp canvas{width:100%;aspect-ratio:1/1;background:#fff;border-radius:0.7rem;border:1px solid var(--border);}
.mn-smp .row{display:flex;align-items:center;justify-content:space-between;margin-top:0.5rem;}
.mn-smp .tag{font-family:var(--mono);font-weight:800;}
.mn-smp .rm{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:0.9rem;}
.mn-smp .rm:hover{color:var(--fg);}


.grid-wrap{display:flex;flex-wrap:wrap;gap:1.2rem;align-items:flex-start;justify-content:center;margin:1.5rem 0;}
.mat-label{font-family:var(--mono);font-size:0.6rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:0.4rem;text-align:center;}
.mat{display:inline-grid;gap:2px;background:var(--border);border-radius:var(--radius);padding:2px;}
.mc{width:2.6rem;height:2.6rem;display:flex;align-items:center;justify-content:center;background:var(--card);font-family:var(--mono);font-size:0.78rem;font-weight:500;transition:all 0.25s;user-select:none;}
.mc.win{background:var(--accent);color:var(--fg);}.mc.win-active{background:var(--fg);color:var(--bg);font-weight:700;}.mc.res{background:var(--accent);font-weight:700;}.mc.done{background:var(--green);color:#fff;}
.op{font-size:1.4rem;color:var(--muted);display:flex;align-items:center;padding:0 0.2rem;font-weight:300;}


.eg{display:inline-grid;gap:2px;background:var(--border);border-radius:var(--radius);padding:2px;}
.ec{width:2.6rem;height:2.6rem;display:flex;align-items:center;justify-content:center;background:var(--card);transition:background 0.2s;}
.ec:focus-within{background:#fff;outline:2px solid var(--fg);outline-offset:-2px;z-index:1;}
.ec input{width:100%;height:100%;border:none;background:transparent;text-align:center;font-family:var(--mono);font-size:0.85rem;font-weight:600;color:var(--fg);outline:none;padding:0;-moz-appearance:textfield;}
.ec input::-webkit-outer-spin-button,.ec input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}


.bmp{display:inline-grid;gap:1px;background:var(--border);border-radius:var(--radius);padding:1px;cursor:crosshair;}
.bc{background:var(--bg);transition:background 0.08s;}
.bc.on{background:var(--fg);}.bc:hover{background:var(--accent);}.bc.on:hover{background:var(--muted);}


.ovlap{display:inline-grid;gap:1px;background:var(--border);border-radius:var(--radius);padding:1px;}
.oc{transition:background 0.15s;}
.oc.both{background:var(--fg);}
.oc.match{background:var(--card);}
.oc.only-user{background:var(--red);opacity:0.7;}
.oc.only-ref{background:var(--blue);opacity:0.7;}


.hb{display:flex;align-items:center;gap:0.5rem;margin:0.3rem 0;}
.hb .dl{font-family:var(--mono);font-size:0.78rem;font-weight:600;width:1.3rem;text-align:center;}
.hb .tk{flex:1;height:1.2rem;background:var(--card);border-radius:9999px;overflow:hidden;}
.hb .fl{height:100%;border-radius:9999px;transition:width 0.5s cubic-bezier(0.22,1,0.36,1);background:var(--fg);}
.hb .fl.best{background:var(--green);}
.hb .dv{font-family:var(--mono);font-size:0.65rem;color:var(--muted);width:5rem;text-align:right;}
.hb input.hguess{
  width:4.8rem;
  height:1.6rem;
  border:1px solid var(--border);
  border-radius:0.55rem;
  padding:0 0.4rem;
  font-family:var(--mono);
  font-size:0.72rem;
  text-align:center;
  background:var(--bg);
  color:var(--fg);
}
.hb input.hguess:focus{outline:2px solid rgba(0,0,0,0.12);}



.chips{display:flex;flex-wrap:wrap;gap:0.35rem;margin:0.8rem 0;}
.chip{font-family:var(--mono);font-size:0.72rem;padding:0.3rem 0.65rem;border:1px solid var(--border);border-radius:9999px;background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;}
.chip:hover{border-color:var(--muted);}.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);}


.upz{border:2px dashed var(--border);border-radius:var(--radius);padding:1.5rem;text-align:center;cursor:pointer;transition:all 0.2s;margin:0.8rem 0;}
.upz:hover,.upz.dg{border-color:var(--fg);background:var(--card);}
.upz p{font-size:0.8rem;color:var(--muted);}.upz input{display:none;}


.cv{image-rendering:pixelated;border-radius:var(--radius);border:2px solid var(--border);}


.ns{-webkit-appearance:none;width:100%;max-width:26rem;height:6px;background:var(--border);border-radius:9999px;outline:none;}
.ns::-webkit-slider-thumb{-webkit-appearance:none;width:1.3rem;height:1.3rem;background:var(--fg);border-radius:50%;cursor:pointer;}
.nout{display:flex;justify-content:center;gap:2rem;margin-top:1rem;flex-wrap:wrap;}
.nb{text-align:center;}.nb .v{font-family:var(--mono);font-size:1.6rem;font-weight:600;}
.nb .l{font-family:var(--mono);font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-top:0.15rem;}
.sw{width:3rem;height:3rem;border-radius:var(--radius);margin:0.3rem auto;border:1px solid var(--border);}


.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:1.4rem 0;}
.cmp-c{padding:1.3rem;}.cmp-c:first-child{border-right:1px solid var(--border);}
.cmp-c h4{font-size:0.86rem;font-weight:600;margin-bottom:0.6rem;}
.cr{font-size:0.8rem;color:var(--muted);line-height:1.7;margin-bottom:0.4rem;}
.cr strong{color:var(--fg);}


footer{border-top:1px solid var(--border);margin-top:auto;}
footer .inner{max-width:68rem;margin:0 auto;padding:1.1rem 1.5rem;display:flex;justify-content:space-between;font-family:var(--mono);font-size:0.65rem;color:var(--muted);}

@media(max-width:640px){
  h1{font-size:1.4rem;white-space:normal;}
  .cmp{grid-template-columns:1fr;}.cmp-c:first-child{border-right:none;border-bottom:1px solid var(--border);}
  .mc,.ec{width:2.1rem;height:2.1rem;font-size:0.68rem;}
  nav{gap:0.5rem;}
  #v-perceptron>div{grid-template-columns:1fr !important;}
}

.tgl-head{cursor:pointer;user-select:none;position:relative;padding-right:2.1rem;display:flex;align-items:center;width:100%;line-height:1.35;min-height:44px;}
.tgl-head::after{content:'▸';position:absolute;right:0.25rem;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:800;}
.tgl-head.open::after{content:'▾';}
.info .tgl-head{padding:0.65rem 0.25rem;}
.card .tgl-head{padding:0.45rem 0;}
.tgl-body{display:none;margin-top:0.55rem;}
.tgl-body.open{display:block;}

.ec-dual{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;}
.ec-title{font-weight:800;margin-bottom:0.35rem;}
@media (max-width: 860px){
  .ec-dual{grid-template-columns:1fr;}
}


/* ═══════ 공통 컴포넌트(cmn) — 추천 영상 · 마중 퀴즈 · 스텝 형성평가 · 핵심 개념 칩 ═══════ */
@keyframes cmnPulse{0%,100%{opacity:1;}50%{opacity:0.42;}}
.cmn-pulse{animation:cmnPulse 1.05s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){
  .cmn-pulse{animation:none;background:var(--green);color:#fff;border-color:var(--green);}
}

/* 추천 영상 카드 그리드 (3열 × 2줄) */
.cmn-vd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.8rem;margin:0.7rem 0 0.5rem;}
@media(max-width:900px){.cmn-vd-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.cmn-vd-grid{grid-template-columns:1fr;}}
.cmn-vd-card{position:relative;border:1px solid var(--border);border-radius:0.7rem;overflow:hidden;background:var(--card);cursor:pointer;transition:all 0.2s;text-align:left;padding:0;font-family:var(--sans);color:var(--fg);display:flex;flex-direction:column;width:100%;}
.cmn-vd-card:hover{border-color:var(--fg);transform:translateY(-2px);box-shadow:0 2px 10px rgba(26,23,20,0.08);}
.cmn-vd-card.last{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);}
.cmn-vd-thumb{position:relative;aspect-ratio:16/9;background:var(--card-h);display:flex;align-items:center;justify-content:center;font-size:2.2rem;overflow:hidden;}
.cmn-vd-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.cmn-vd-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:2.7rem;height:2.7rem;border-radius:50%;background:rgba(26,23,20,0.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;pointer-events:none;}
.cmn-vd-meta{padding:0.55rem 0.7rem 0.75rem;}
.cmn-vd-meta b{display:block;font-size:0.95rem;font-weight:600;line-height:1.45;}
.cmn-vd-meta span{display:block;font-size:0.8rem;color:var(--muted);margin-top:0.2rem;}
.cmn-vd-del{position:absolute;top:0.35rem;right:0.35rem;z-index:2;width:1.9rem;height:1.9rem;border-radius:50%;border:none;background:rgba(26,23,20,0.62);color:#fff;font-size:0.85rem;cursor:pointer;line-height:1;padding:0;}
.cmn-vd-add{border:2px dashed var(--border);border-radius:0.7rem;background:transparent;cursor:pointer;min-height:9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.3rem;color:var(--muted);font-family:var(--sans);transition:all 0.2s;width:100%;}
.cmn-vd-add:hover{border-color:var(--fg);color:var(--fg);background:var(--card);}
.cmn-vd-add .p{font-size:1.9rem;line-height:1;}
.cmn-vd-add .l{font-size:0.85rem;line-height:1.4;text-align:center;padding:0 0.4rem;}
.cmn-vd-form{display:none;gap:0.4rem;flex-wrap:wrap;align-items:center;margin:0.6rem 0 0;}
.cmn-vd-form.on{display:flex;}
.cmn-in{font-family:var(--sans);font-size:0.9rem;padding:0.45rem 0.6rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--fg);flex:1 1 11rem;min-width:0;max-width:100%;}
.cmn-note{font-size:0.85rem;color:var(--muted);margin-top:0.4rem;min-height:1.2rem;line-height:1.6;}

/* 전체 화면 재생 오버레이 */
.cmn-ov{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;}
.cmn-ov iframe{width:100%;height:100%;border:0;display:block;}
.cmn-ov-x{position:absolute;top:0.8rem;right:0.9rem;z-index:3;width:2.7rem;height:2.7rem;border-radius:50%;border:none;background:rgba(255,255,255,0.88);color:#111;font-size:1.05rem;cursor:pointer;padding:0;}
.cmn-ov-new{position:absolute;top:1.1rem;left:0.9rem;z-index:3;font-family:var(--sans);font-size:0.88rem;
  background:rgba(255,255,255,0.9);color:#111;text-decoration:none;padding:0.45rem 0.9rem;border-radius:9999px;}
.cmn-ov-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;margin:0;
  font-family:var(--sans);font-size:1rem;color:#fff;text-align:center;padding:0 1.5rem;line-height:1.7;}
.cmn-vd-emo{font-size:2.4rem;line-height:1;}
.cmn-vd-badge{position:absolute;left:0.4rem;top:0.4rem;font-family:var(--mono);font-size:0.66rem;
  background:rgba(26,23,20,0.72);color:#fff;padding:0.15rem 0.45rem;border-radius:0.35rem;letter-spacing:0.06em;}

/* ═══════ 참고 자료 — 학급 공유 자료함 · 교사 추가 · 내보내기 (§25) ═══════ */
.rx{margin-top:1.1rem;border-top:1px dashed var(--border);padding-top:1rem;}
.rx-share{display:flex;flex-wrap:wrap;align-items:center;gap:0.6rem;background:var(--bg);
  border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:0 var(--radius) var(--radius) 0;
  padding:0.85rem 1rem;margin-bottom:0.8rem;}
.rx-share .ic{font-size:1.5rem;line-height:1;}
.rx-share .tx{flex:1 1 14rem;min-width:0;font-size:0.95rem;color:var(--body);line-height:1.65;}
.rx-share .tx b{display:block;color:var(--fg);font-size:1rem;}
.rx-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:0.7rem;margin-bottom:0.7rem;}
.rx-card{position:relative;display:block;text-decoration:none;color:inherit;background:var(--bg);
  border:1px solid var(--border);border-radius:0.7rem;overflow:hidden;transition:all 0.2s;}
.rx-card:hover{border-color:var(--fg);transform:translateY(-2px);}
.rx-card .th{position:relative;aspect-ratio:16/9;background:var(--card);display:flex;align-items:center;
  justify-content:center;font-size:2rem;overflow:hidden;}
.rx-card .th img{width:100%;height:100%;object-fit:cover;display:block;}
.rx-card .bg{position:absolute;left:0.35rem;top:0.35rem;font-family:var(--mono);font-size:0.64rem;
  background:rgba(26,23,20,0.75);color:#fff;padding:0.12rem 0.4rem;border-radius:0.3rem;}
.rx-card .tx{padding:0.5rem 0.65rem 0.7rem;font-size:0.92rem;font-weight:600;line-height:1.45;}
.rx-card .rm{position:absolute;top:0.3rem;right:0.3rem;z-index:2;width:1.75rem;height:1.75rem;border-radius:50%;
  border:none;background:rgba(26,23,20,0.62);color:#fff;font-size:0.8rem;cursor:pointer;padding:0;line-height:1;}
.rx-form{display:none;gap:0.4rem;flex-wrap:wrap;align-items:center;margin:0.5rem 0;}
.rx-form.on{display:flex;}
.rx-tools{display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:0.5rem;}
.rx-note{font-size:0.88rem;color:var(--muted);line-height:1.7;margin-top:0.5rem;}

/* 마중 퀴즈 · 형성평가 공통 */
.cmn-q{font-size:1.05rem;font-weight:600;line-height:1.7;margin:0.2rem 0 0.6rem;color:var(--fg);}
.cmn-fb{font-size:1.05rem;font-weight:700;line-height:1.8;padding:0.85rem 1.05rem;border-radius:0.5rem;background:var(--bg);margin:0.7rem 0;}
.cmn-fb.ok{border-left:5px solid var(--green);color:var(--green);}
.cmn-fb.no{border-left:5px solid var(--red);color:var(--red);}
.cmn-fb b{color:var(--fg);}
.cmn-fb .x{display:block;font-weight:400;color:var(--body);margin-top:0.4rem;font-size:1.0rem;line-height:1.85;}
.cmn-warm-item{margin:0 0 1.1rem;}
.cmn-warm-end{margin-top:0.9rem;font-size:1.02rem;font-weight:600;color:var(--fg);line-height:1.75;}
.cmn-prog{font-family:var(--mono);font-size:0.78rem;letter-spacing:0.1em;color:var(--muted);margin-bottom:0.4rem;}
.cmn-bar{height:5px;background:var(--card-h);border-radius:9999px;overflow:hidden;margin-bottom:0.9rem;}
.cmn-bar i{display:block;height:100%;background:var(--fg);border-radius:9999px;transition:width 0.35s;}
.cmn-score{font-size:1.25rem;font-weight:700;margin-bottom:0.3rem;}
.cmn-rev{margin:0.8rem 0;}
.cmn-rev-it{border-bottom:1px solid var(--border);padding:0.55rem 0;cursor:pointer;font-size:0.98rem;line-height:1.65;}
.cmn-rev-it .m{font-weight:700;font-family:var(--mono);margin-right:0.4rem;}
.cmn-rev-it .m.o{color:var(--green);}
.cmn-rev-it .m.x{color:var(--red);}
.cmn-rev-ex{display:none;font-size:0.95rem;color:var(--body);margin-top:0.4rem;line-height:1.75;padding-left:1.3rem;}
.cmn-rev-ex.on{display:block;}
.cmn-opt{text-transform:none;font-family:var(--sans);font-size:0.95rem;letter-spacing:0;padding:0.6rem 1rem;min-height:2.8rem;text-align:left;line-height:1.5;max-width:100%;white-space:normal;}
.cmn-opt.pick{background:var(--fg);color:var(--bg);border-color:var(--fg);}
.cmn-opt.ans{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green);}
.cmn-opt:disabled{opacity:0.75;}
.cmn-go{text-transform:none;font-family:var(--sans);font-size:0.95rem;letter-spacing:0;min-height:2.8rem;}

/* 핵심 개념 칩 확대 + 클릭 상세 설명 */
.cmn-kchips{gap:0.45rem;}
.cmn-kchips .chip{font-family:var(--sans);font-size:1.15rem;font-weight:600;letter-spacing:0;padding:0.65rem 1.25rem;min-height:2.9rem;background:var(--card);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;}
.cmn-kchips .chip:hover{border-color:var(--fg);}
.cmn-kchips .chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);}
.cmn-kc{display:none;background:var(--card);border-left:4px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:1rem 1.2rem;margin:0.7rem 0 1.2rem;font-size:1.05rem;line-height:1.85;color:var(--body);}
.cmn-kc.on{display:block;}
.cmn-kc b,.cmn-kc strong{color:var(--fg);}
.cmn-kc p{font-size:1.02rem;line-height:1.85;color:var(--body);}
.cmn-kc .btn{text-transform:none;font-family:var(--sans);font-size:0.9rem;letter-spacing:0;}

/* ═══════ 차시 목록 드롭다운 (nav) ═══════ */
nav{position:relative;}
/* 패널은 .nav-menu 가 아니라 nav 기준으로 배치해 우측 넘침을 막습니다. */
.nav-menu{flex-shrink:0;}
.nav-menu-btn{font-family:var(--sans);font-size:0.9rem;font-weight:600;letter-spacing:0;
  padding:0.55rem 1.05rem;min-height:44px;text-transform:none;background:var(--card);color:var(--fg);}
.nav-menu-btn[aria-expanded="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);}
.nav-cur{font-family:var(--sans);font-size:0.9rem;font-weight:500;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0;}
.nav-cur::before{content:'│';margin-right:0.7rem;color:var(--border);}
.nav-cur:empty{display:none;}
.nav-panel{display:none;position:absolute;top:calc(100% - 0.25rem);left:1.5rem;z-index:200;
  width:min(46rem,calc(100% - 3rem));max-height:min(74vh,42rem);overflow-y:auto;overscroll-behavior:contain;
  background:var(--bg);border:1px solid var(--border);border-radius:0.8rem;
  box-shadow:0 10px 32px rgba(26,23,20,0.18);padding:0.9rem 1rem 1.1rem;}
.nav-panel.on{display:block;}
.nav-unit{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.14em;color:var(--muted);
  text-transform:uppercase;margin:0.95rem 0 0.45rem;padding-bottom:0.3rem;border-bottom:1px solid var(--border);}
.nav-unit:first-child{margin-top:0.15rem;}
.nav-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:0.3rem;}
.nav-item{display:flex;align-items:center;gap:0.5rem;width:100%;text-align:left;font-family:var(--sans);
  font-size:0.92rem;line-height:1.4;padding:0.55rem 0.7rem;min-height:44px;border:1px solid transparent;
  border-radius:0.5rem;background:transparent;color:var(--fg);cursor:pointer;transition:all 0.15s;}
.nav-item:hover{background:var(--card);border-color:var(--border);}
.nav-item .n{font-family:var(--mono);font-size:0.78rem;font-weight:700;color:var(--muted);
  flex-shrink:0;min-width:3.1rem;}
.nav-item.cur{background:var(--fg);color:var(--bg);border-color:var(--fg);}
.nav-item.cur .n{color:var(--accent);}
.nav-item.soon{color:var(--muted);opacity:0.65;cursor:not-allowed;}
.nav-item.soon:hover{background:transparent;border-color:transparent;}
.nav-item.soon .s{font-family:var(--mono);font-size:0.68rem;margin-left:auto;padding:0.1rem 0.4rem;
  border:1px dashed var(--border);border-radius:9999px;flex-shrink:0;}
/* 좁은 화면에서는 화면 폭에 맞춰 고정 배치(가로 넘침 방지) */
@media(max-width:820px){
  .nav-panel{position:fixed;left:0.75rem;right:0.75rem;top:3.9rem;width:auto;max-height:76vh;}
  .nav-list{grid-template-columns:1fr;}
  .nav-cur{display:none;}
}

/* ═══════ 홈 — 단원 소제목 · 차시 카드 썸네일 · 준비 중 카드 ═══════ */
.hm-unit{display:flex;align-items:baseline;gap:0.7rem;margin:2.4rem 0 1rem;flex-wrap:wrap;}
.hm-unit h3{font-size:1.25rem;font-weight:600;margin:0;letter-spacing:-0.01em;}
.hm-unit .r{font-family:var(--mono);font-size:0.75rem;letter-spacing:0.1em;color:var(--muted);}
.hm-unit::after{content:'';flex:1;height:1px;background:var(--border);min-width:2rem;}
.hm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:1rem;}
.hm-grid .card-link{padding:0;overflow:hidden;display:flex;flex-direction:column;}
.hm-grid .card-link::after{top:auto;bottom:1.1rem;right:1.2rem;}
.hm-th{aspect-ratio:16/9;background:var(--bg);border-bottom:1px solid var(--border);overflow:hidden;}
.hm-th svg{display:block;width:100%;height:100%;}
.hm-body{padding:1.05rem 1.2rem 2.4rem;flex:1;}
.hm-body h3{font-size:1.15rem;margin-bottom:0.45rem;}
.hm-body p{font-size:1.02rem;color:var(--body);line-height:1.8;padding-right:0;}
.hm-no{background:transparent;border:1px dashed var(--border);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;opacity:0.72;cursor:not-allowed;}
.hm-no .hm-th{background:var(--card);border-bottom:1px dashed var(--border);}
.hm-no .hm-body{padding:1.05rem 1.2rem 1.2rem;}
.hm-no h3{font-size:1.05rem;font-weight:600;color:var(--muted);margin-bottom:0.35rem;}
.hm-no p{font-size:0.92rem;color:var(--muted);line-height:1.7;}
.hm-no .badge{display:inline-block;font-family:var(--mono);font-size:0.68rem;letter-spacing:0.1em;
  color:var(--muted);border:1px dashed var(--border);border-radius:9999px;padding:0.15rem 0.55rem;margin-top:0.5rem;}

/* ═══════ 뷰 표제부 워터마크 (홈 카드 SVG 재사용) ═══════ */
.vw-wrap{position:relative;}
.vw-mark{position:absolute;top:-1.4rem;right:-0.6rem;width:min(19rem,42%);opacity:0.1;
  pointer-events:none;z-index:0;}
.vw-mark svg{display:block;width:100%;height:auto;}
.vw-wrap>*:not(.vw-mark){position:relative;z-index:1;}
@media(max-width:760px){.vw-mark{display:none;}}

/* ═══════ 사진 자료 공통 (§26 — 커먼스 검증 사진 + 캡션 + 폴백) ═══════ */
.phz{margin:1.1rem 0;max-width:100%;}
.phz img{display:block;width:100%;height:auto;max-width:100%;border-radius:0.6rem;
  border:1px solid var(--border);background:var(--card);}
.phz .fb{display:none;align-items:center;justify-content:center;width:100%;min-height:8rem;
  font-size:3rem;background:var(--card);border:1px solid var(--border);border-radius:0.6rem;}
.phz.nofoto .fb{display:flex;}
.phz figcaption{font-size:0.86rem;color:var(--muted);line-height:1.65;margin-top:0.4rem;}
.phz figcaption b{color:var(--body);font-weight:600;}
.phz figcaption .src{display:block;font-size:0.78rem;margin-top:0.2rem;}
.phz-r{float:right;width:100%;max-width:260px;margin:0.2rem 0 0.9rem 1.3rem;}
.phz-l{float:left;width:100%;max-width:260px;margin:0.2rem 1.3rem 0.9rem 0;}
.phz-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem;margin:1.1rem 0;}
.phz-row .phz{margin:0;}
@media(max-width:560px){
  .phz-r,.phz-l{float:none;max-width:100%;margin:1rem 0;}
}

/* ═══════ 프로젝트 과제 카드 (§21) ═══════ */
.pj{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--green);
  border-radius:var(--radius);padding:1.4rem;margin:1.6rem 0 1.2rem;}
.pj>.lb{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.16em;color:var(--green);
  text-transform:uppercase;display:block;margin-bottom:0.35rem;}
.pj h3{font-size:1.2rem;margin-bottom:0.5rem;}
.pj .sub{font-size:1.02rem;color:var(--body);line-height:1.85;margin-bottom:0.9rem;}
.pj dl{display:grid;grid-template-columns:auto 1fr;gap:0.5rem 0.9rem;margin:0;align-items:baseline;}
.pj dt{font-family:var(--mono);font-size:0.78rem;letter-spacing:0.06em;color:var(--fg);font-weight:600;
  white-space:nowrap;padding-top:0.15rem;}
.pj dd{margin:0;font-size:1.0rem;color:var(--body);line-height:1.8;}
.pj dd b{color:var(--fg);}
@media(max-width:560px){
  .pj dl{grid-template-columns:1fr;gap:0.15rem;}
  .pj dt{margin-top:0.5rem;}
}

/* ═══════ 학습지 섹션 (§20) ═══════ */
.ws{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.4rem;margin:1.6rem 0 1.2rem;}
.ws>.lb{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.16em;color:var(--muted);
  text-transform:uppercase;display:block;margin-bottom:0.35rem;}
.ws h3{font-size:1.2rem;margin-bottom:0.5rem;}
.ws p{font-size:1.0rem;color:var(--body);line-height:1.85;}
.ws-dl{display:flex;flex-wrap:wrap;gap:0.6rem;margin:0.9rem 0 0.4rem;align-items:stretch;}
.ws-btn{display:inline-flex;align-items:center;gap:0.55rem;text-decoration:none;font-family:var(--sans);
  font-size:0.98rem;font-weight:600;color:var(--bg);background:var(--fg);border:1px solid var(--fg);
  border-radius:var(--radius);padding:0.65rem 1.1rem;min-height:44px;cursor:pointer;transition:opacity 0.2s;}
.ws-btn:hover{opacity:0.86;}
.ws-btn.sec{background:var(--bg);color:var(--fg);border-color:var(--border);}
.ws-btn.sec:hover{background:var(--card-h);opacity:1;}
.ws-btn .sz{font-family:var(--mono);font-size:0.75rem;font-weight:400;opacity:0.75;}
.ws-links{display:flex;flex-direction:column;gap:0.35rem;margin-top:0.8rem;}
.ws-link{display:flex;align-items:center;gap:0.5rem;font-size:0.95rem;}
.ws-link a{color:var(--blue);}
.ws-link button{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:0.9rem;padding:0.2rem 0.4rem;}
.ws-add{display:none;gap:0.4rem;flex-wrap:wrap;align-items:center;margin-top:0.7rem;}
.ws-add.on{display:flex;}

/* 학습지 지면(A4 인쇄 전용) — 화면에서는 숨기고 인쇄 시에만 보입니다. */
.ws-sheet{display:none;}
@media print{
  body.ws-printing *{visibility:hidden !important;}
  body.ws-printing .ws-sheet.printing,
  body.ws-printing .ws-sheet.printing *{visibility:visible !important;}
  body.ws-printing .ws-sheet.printing{display:block !important;position:absolute !important;
    left:0;top:0;width:100%;padding:0;background:#fff;color:#000;font-size:11pt;line-height:1.6;}
  @page{size:A4;margin:14mm 13mm;}
}
.ws-sheet.printing{display:block;position:fixed;left:-200vw;top:0;width:186mm;}
.ws-sheet h2{font-size:15pt;margin:0 0 2mm;letter-spacing:-0.02em;}
.ws-sheet .ws-h{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;
  border-bottom:1.5pt solid #000;padding-bottom:2mm;margin-bottom:4mm;}
.ws-sheet .ws-id{font-size:10pt;white-space:nowrap;}
.ws-sheet h3{font-size:11.5pt;margin:5mm 0 1.5mm;padding-left:2mm;border-left:3pt solid #000;}
.ws-sheet p,.ws-sheet li{font-size:10pt;line-height:1.65;margin:0 0 1.5mm;}
.ws-sheet ol,.ws-sheet ul{margin:0 0 2mm 5mm;}
.ws-sheet .rule{border:1pt solid #666;border-radius:2mm;min-height:16mm;margin:1.5mm 0 3mm;padding:2mm;}
.ws-sheet .rule.sm{min-height:11mm;}
.ws-sheet .rule.lg{min-height:26mm;}
.ws-sheet table{width:100%;border-collapse:collapse;margin:1.5mm 0 3mm;font-size:9.5pt;}
.ws-sheet th,.ws-sheet td{border:0.8pt solid #444;padding:1.8mm 2mm;text-align:left;vertical-align:top;}
.ws-sheet th{background:#eee;font-weight:600;white-space:nowrap;}
.ws-sheet td.blank{height:9mm;}
.ws-sheet .note{font-size:9pt;color:#444;}

/* ═══════ 생활 속 AI 사례 카드 (§22) ═══════ */
.lai-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:0.7rem;margin:1rem 0 0.3rem;}
.lai{display:flex;flex-direction:column;align-items:center;gap:0.3rem;text-align:center;
  background:var(--bg);border:1px solid var(--border);border-radius:0.8rem;padding:0.9rem 0.6rem;
  cursor:pointer;font-family:var(--sans);color:var(--fg);transition:all 0.2s;line-height:1.4;}
.lai:hover{border-color:var(--fg);transform:translateY(-2px);box-shadow:0 2px 10px rgba(26,23,20,0.07);}
.lai.on{background:var(--fg);color:var(--bg);border-color:var(--fg);}
.lai .em{font-size:2rem;line-height:1.2;}
.lai b{font-size:0.95rem;font-weight:600;}
.lai .io{font-family:var(--mono);font-size:0.72rem;color:var(--muted);}
.lai.on .io{color:var(--accent);}
.lai-panel{display:none;background:var(--card);border-left:4px solid var(--accent);
  border-radius:0 var(--radius) var(--radius) 0;padding:1.1rem 1.2rem;margin:0.9rem 0 0.4rem;}
.lai-panel.on{display:block;}
.lai-panel h4{font-size:1.05rem;font-weight:600;margin-bottom:0.4rem;}
.lai-panel p{font-size:1.0rem;color:var(--body);line-height:1.85;}

/* ═══════ 교과서 지면 캡처 — 로컬 전용(§32) ═══════ */
.tbshot-wrap{margin-top:1.1rem;}
.tbshot-head{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.12em;color:var(--muted);
  text-transform:uppercase;margin:0.9rem 0 0.5rem;}
.tbshot-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:0.8rem;}
.tbshot-row:empty{display:none;}
.tbshot{margin:0;max-width:100%;}
.tbshot img{display:block;width:100%;height:auto;max-width:100%;border:1px solid var(--border);
  border-radius:0.5rem;background:#fff;}
.tbshot figcaption{font-size:0.78rem;color:var(--muted);line-height:1.55;margin-top:0.3rem;}
.tbshot figcaption .src{display:block;font-size:0.72rem;margin-top:0.12rem;}
.tbbox:has(.tbshot-row:empty){display:none;}

</style>
</head>

    <div class="nav-menu" id="nav-menu">
      <button class="nav-btn nav-menu-btn" id="nav-menu-btn" type="button"
              aria-haspopup="true" aria-expanded="false" aria-controls="nav-panel">차시 목록 <span aria-hidden="true">▾</span></button>
      <div class="nav-panel" id="nav-panel" role="menu" aria-label="전체 차시 목록"></div>
