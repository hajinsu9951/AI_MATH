<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="논리 회로와 진리표, IF-THEN 규칙과 추론 엔진, 순서도의 세 장면"><rect width="1280" height="720" fill="#f6f5f4"/><path d="M430 118 V624" stroke="#e0ded9" stroke-width="2" stroke-dasharray="6 8"/><path d="M880 118 V624" stroke="#e0ded9" stroke-width="2" stroke-dasharray="6 8"/><text x="215" y="90" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="25" fill="#2f2f2f" text-anchor="middle" font-weight="600">① 진리표 — 참·거짓을 계산한다</text><rect x="46" y="210" width="100" height="44" rx="22" fill="#0075de"/><circle cx="124" cy="232" r="16" fill="#fff"/><text x="82" y="239" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="600">ON</text><path d="M146 232 H222" stroke="#0075de" stroke-width="5" fill="none"/><rect x="46" y="310" width="100" height="44" rx="22" fill="#0075de"/><circle cx="124" cy="332" r="16" fill="#fff"/><text x="82" y="339" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="600">ON</text><path d="M146 332 H222" stroke="#0075de" stroke-width="5" fill="none"/><path d="M222 202 h40 a80 80 0 0 1 0 160 h-40 z" fill="#fff" stroke="#2f2f2f" stroke-width="5" stroke-linejoin="round"/><text x="272" y="292" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="23" fill="#2f2f2f" text-anchor="middle" font-weight="600">AND</text><path d="M342 282 H392 V456 H382" stroke="#0075de" stroke-width="5" fill="none"/><circle cx="344" cy="456" r="50" fill="#0075de" opacity="0.15"/><circle cx="344" cy="456" r="38" fill="#fff" stroke="#2f2f2f" stroke-width="5"/><path d="M344 430 v34 M330 446 l14 -16 l14 16" stroke="#0075de" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M328 500 h32 M334 514 h20" stroke="#2f2f2f" stroke-width="5" stroke-linecap="round"/><text x="215" y="568" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="20" fill="#8a8580" text-anchor="middle" font-weight="500">둘 다 참(1)일 때만 켜집니다</text><text x="215" y="602" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="24" fill="#0075de" text-anchor="middle" font-weight="700">1 ∧ 1 = 1</text><text x="655" y="90" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="25" fill="#2f2f2f" text-anchor="middle" font-weight="600">② 전문가 시스템 — 규칙을 쌓는다</text><rect x="470" y="178" width="252" height="60" rx="12" fill="#fff" stroke="#0075de" stroke-width="4"/><text x="486" y="215" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="17" fill="#0075de" text-anchor="start" font-weight="700">IF</text><text x="514" y="215" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="17" fill="#2f2f2f" text-anchor="start" font-weight="500">비가 온다</text><text x="604" y="215" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="17" fill="#8a8580" text-anchor="middle" font-weight="600">→</text><text x="618" y="215" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="16" fill="#2f2f2f" text-anchor="start" font-weight="500">우산 챙김</text><path d="M722 208 H730" stroke="#8a8580" stroke-width="4" fill="none"/><rect x="470" y="260" width="252" height="60" rx="12" fill="#fff" stroke="#2f2f2f" stroke-width="4"/><text x="486" y="297" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="17" fill="#0075de" text-anchor="start" font-weight="700">IF</text><text x="514" y="297" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="17" fill="#2f2f2f" text-anchor="start" font-weight="500">열이 난다</text><text x="604" y="297" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="17" fill="#8a8580" text-anchor="middle" font-weight="600">→</text><text x="618" y="297" font-family="'Noto Sans KR','Inter',system-ui,sans-serif" font-size="16" fill="#2f2f2f" text-anchor="start" font-weight="500">감